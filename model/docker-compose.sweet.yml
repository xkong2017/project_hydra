services:
  vllm:
    #image: ghcr.io/aeon-7/aeon-vllm-ultimate:2026-06-18-v0.23.0-dflashfix
    image: ghcr.io/aeon-7/aeon-vllm-ultimate:maxsafe-20260708
    container_name: aeon-ultimate-xs-tq-fix
    #container_name: aeon-ultimate-xs-tq-v5
    restart: unless-stopped
    network_mode: host
    ipc: host
    ulimits:
      memlock: -1

    environment:
      # ─── Core vLLM ───
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1

      # ─── GB10 / sm_121a runtime ───
      - TORCH_CUDA_ARCH_LIST=12.1a
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - TORCH_MATMUL_PRECISION=high
      - NVIDIA_FORWARD_COMPAT=1
      - NVIDIA_DISABLE_REQUIRE=1

      # Required by PR #40191 for sm_121a-only builds — without this,
      # vllm._C_stable_libtorch.abi3.so fails to import.
      - ENABLE_NVFP4_SM100=0

      # ─── FP4 path selection ───
      - VLLM_USE_FLASHINFER_MOE_FP4=0
      - VLLM_TEST_FORCE_FP8_MARLIN=0
      - VLLM_USE_FLASHINFER_SAMPLER=1
      # XS-specific: explicitly select the patched CUTLASS NVFP4 GEMM backend.
      - VLLM_NVFP4_GEMM_BACKEND=flashinfer-cutlass
      - CUTE_DSL_ARCH=sm_121a

      # TurboQuant - for `kv-cache-dtype` use `fp8` 
      # - VLLM_USE_TURBOQUANT=1
      # - TURBOQUANT_KV_BITS=4
    volumes:
      # XS multimodal body (modelopt format, ~21 GB) — replaces the regular NVFP4 body
      - /home/mike2026/model/Qwen3.6-27B-PrismaSCOUT-Blackwell-NVFP4-BF16-vllm:/models/xs
      # - ~/models/Qwen3.6-27B-PrismaAURA-5.5bit-vllm:/models/xs
      # DFlash drafter (~3.46 GB)
      - /home/mike2026/model/zlab-dflash-draft-27b:/models/dflash-drafter
      - ~/models/mods/fix-qwen3.6-enhanced-chat-template/fixed_chat_template-v5.jinja:/app/fixed_chat_template-v5.jinja

    entrypoint: ["vllm"]
    command:
      - serve
      - /models/xs
      - --served-model-name
      - qwen
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tensor-parallel-size
      - "1"
      - --dtype
      - bfloat16
      # CRITICAL: Switched to modelopt to match your XS body type 
      - --quantization
      - compressed-tensors
      - --kv-cache-dtype
      - auto
      - --max-model-len
      # - "262144"
      - "196608"
      - --max-num-seqs
      - "6"
      - --max-num-batched-tokens
      - "32768"
      - --gpu-memory-utilization
      # - "0.62" ### only for DFlash for 256K context - use between 0.60 to 0.65
      - "0.72" ### only for DFlash for 192K context - use between 0.63 to 0.102
      # - "0.52" ### only for MTP
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --generation-config
      - vllm
      - --override-generation-config
      - '{"temperature": 0.7, "top_p": 0.8, "top_k": 40, "presence_penalty": 0.0, "repetition_penalty": 1.0}'
      - --load-format
      - fastsafetensors
      - --mamba-block-size
      - "256"
      - --trust-remote-code
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --reasoning-parser
      - qwen3
      # CRITICAL: Switched to flashinfer to prevent non-causal DFlash validation faults on Blackwell
      - --attention-backend
      - flashinfer
      - --limit-mm-per-prompt
      - '{"image": 4, "video": 2}'
      - --mm-encoder-tp-mode
      - data
      - --mm-processor-cache-type
      - shm
      - --mm-shm-cache-max-object-size-mb
      - "256"
      - --chat-template
      - /app/fixed_chat_template-v5.jinja
      - --speculative-config
      - '{"method":"dflash","model":"/models/dflash-drafter","num_speculative_tokens":10}'
      # - '{"method": "mtp", "num_speculative_tokens": 3}'
    
        # Notes on configuration choices:
        #   - --quantization modelopt — required for the XS body. The XS body ships in
        #     modelopt format (NVFP4 element + FP8 per-block + FP32 per-tensor scales).
        #     The previous regular NVFP4 body was compressed-tensors format; modelopt is
        #     the format vLLM serves through this code path.
        #   - --speculative-config '{"method":"dflash",...}' — DFlash with the external
        #     z-lab drafter. The XS body has a grafted MTP head in its safetensors but
        #     it is *not* used here. Don't switch this to method:"qwen3_5_mtp" unless
        #     you are deliberately running an ablation.
        #   - --gpu-memory-utilization 0.75 is the default gateway cap when ASR, TTS,
        #     embedding, or other GPU services share the Spark. If this is the only
        #     major GPU workload, 0.85 is the long-context production cap; 0.88+ can
        #     thrash unified memory. (RTX PRO 6000 has more headroom — it caps at 0.94.)
        #   - --max-num-batched-tokens 32768 is the ceiling. vLLM's inductor compile-range
        #     endpoint is [32768], so above 32k prefill falls back to eager mode.

    # GPU exposure — required on hosts where Docker's default-runtime is not 'nvidia'.
    # The DGX Spark base image ships with `default-runtime: nvidia` so this block is a
    # no-op there, but on most other Linux hosts (default-runtime: runc) the container
    # cannot see the GPU without it. Reported in issue #5; canonical Docker Compose v3
    # spec for GPU reservation.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
